[package]
name = "fast-worktree"
version = "0.3.1"
edition = "2021"
rust-version = "1.89"
description = "Create a git worktree with its dependencies in seconds, and remove it in one"
license = "MIT"
repository = "https://github.com/t09tanaka/fast-worktree"
readme = "README.md"
keywords = ["git", "worktree", "npm", "flutter", "dev-tools"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "README.md", "CHANGELOG.md", "LICENSE"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
sha2 = "0.10"
libc = "0.2"
ignore = "0.4"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
